version: '3.8'

# Secrets are never stored in this file (the repo is public). Required values
# (SECRET_KEY, DB_PASSWORD, REDIS_URL, CELERY_BROKER_URL, PAYSTACK_SECRET_KEY)
# must be set in the Portainer stack environment; the deploy fails loudly if not.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aso_backend
    restart: always
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in the Portainer stack environment}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-asomarketplace.com.ng,www.asomarketplace.com.ng,api.asomarketplace.com.ng,app-69-164-247-208.sslip.io,api-69-164-247-208.sslip.io,69.164.247.208,localhost,127.0.0.1,aso_backend}
      - DB_ENGINE=${DB_ENGINE:-django.db.backends.postgresql}
      - DB_NAME=${DB_NAME:-aso_db}
      - DB_USER=${DB_USER:-aso_admin}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in the Portainer stack environment}
      - DB_HOST=${DB_HOST:-aso_postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_SSLMODE=${DB_SSLMODE:-}
      - REDIS_URL=${REDIS_URL:?Set REDIS_URL in the Portainer stack environment}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:?Set CELERY_BROKER_URL in the Portainer stack environment}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://asomarketplace.com.ng,https://www.asomarketplace.com.ng,https://api.asomarketplace.com.ng,https://app-69-164-247-208.sslip.io,http://69.164.247.208:3000,http://localhost:5173,http://localhost:3000}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-https://asomarketplace.com.ng,https://www.asomarketplace.com.ng,https://api.asomarketplace.com.ng,https://app-69-164-247-208.sslip.io,https://api-69-164-247-208.sslip.io,http://69.164.247.208:3000,http://localhost:5173,http://localhost:3000}
      - FRONTEND_URL=${FRONTEND_URL:-https://asomarketplace.com.ng}
      - PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY:?Set PAYSTACK_SECRET_KEY in the Portainer stack environment}
      - PAYSTACK_PUBLIC_KEY=${PAYSTACK_PUBLIC_KEY:-pk_test_mock_paystack_public_key}
      - ASO_STORAGE_PUBLIC_BASE=${ASO_STORAGE_PUBLIC_BASE:-https://cdn.aso.ng}
      # Optional provider keys: set in the Portainer stack environment (never here).
      - NVIDIA_NIM_API_KEY=${NVIDIA_NIM_API_KEY:-}
      - DELLYMAN_API_KEY=${DELLYMAN_API_KEY:-}
      - DELLYMAN_WEBHOOK_SECRET=${DELLYMAN_WEBHOOK_SECRET:-}
    ports:
      - "8000:8000"
    volumes:
      - aso_media_data:/app/media
      - aso_static_data:/app/staticfiles
    networks:
      - aso-network

networks:
  aso-network:
    name: aso_internal_network
    external: true

volumes:
  aso_media_data:
  aso_static_data:
